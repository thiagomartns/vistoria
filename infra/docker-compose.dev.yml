name: vistoria-dev

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vistoria-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?rode pnpm db:init para gerar a senha em infra/.env}
    ports:
      - "127.0.0.1:1433:1433" # só localhost: o banco de dev nunca fica exposto na rede
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
