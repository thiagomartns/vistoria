name: vistoria-dev

services:
  db:
    # Tag exata da CU (#194, ADR 0069). O Dependabot não sobe a CU: ele lê a tag como 2022 com o sufixo "-CU28-…".
    # A troca é à mão, nos dois composes; o SqlServerContainer dos testes e o job e2e leem a do compose de dev.
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    container_name: vistoria-db
    restart: unless-stopped # volta sozinho depois de um reboot; pnpm db:down continua parando de vez
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?rode pnpm db:init para gerar a senha em infra/.env}
    ports:
      - "127.0.0.1:1433:1433" # só localhost: o banco de dev nunca fica exposto na rede
    volumes:
      - sqldata:/var/opt/mssql
    # A senha vai pelo ambiente do sqlcmd (SQLCMDPASSWORD), nunca por -P: argumento aparece no `ps` (#196).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
