# Semanal, um PR agrupado por ecossistema. O cooldown de 7 dias acompanha o
# minimumReleaseAge do pnpm (pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A major do @types/node acompanha a do runtime (.node-version) e sobe junto com ele.
    # O typescript 6 do scripts/gen-api fica na major: o @hey-api/openapi-ts usa a API JS do compilador,
    # que o TypeScript 7 não expõe. A regra vale também para o web, cuja próxima major sobe à mão.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A major dos pacotes da Microsoft e do dotnet-ef acompanha a do runtime (TargetFramework em
    # Directory.Build.props) e sobe junto com ele, à mão: a 11 do ApiDescription.Server só traz o
    # GetDocument para net11.0 e quebra a geração do openapi.json no net10.0 (#219).
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # As imagens base dos dois Dockerfiles (#194). A major do sdk/aspnet acompanha a do TargetFramework, e a do node, o
  # .node-version: sobem à mão, junto com eles, como no nuget e no npm.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /infra/proxy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # As imagens dos composes. A CU do SQL Server não sobe por aqui: o Dependabot lê `2022-CU28-ubuntu-22.04` como a
  # versão 2022 com o sufixo "-CU28-…", e a CU seguinte muda o sufixo. Ela sobe à mão (ADR 0069).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
