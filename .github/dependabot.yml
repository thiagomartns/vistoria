# Semanal, um PR agrupado por ecossistema. O cooldown de 7 dias acompanha o
# minimumReleaseAge do pnpm (pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A major do @types/node acompanha a do runtime (.node-version) e sobe junto com ele.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
