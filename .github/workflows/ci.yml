name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    # Os testes de integração baixam a imagem do SQL Server (Testcontainers usa o Docker do runner).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      - name: Build (regenera openapi.json)
        run: dotnet build Vistoria.sln -c Release

      - name: openapi.json igual ao commitado
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=apps/api/openapi.json::openapi.json desatualizado: rode o build da API e commite o arquivo."
            exit 1
          fi

      - name: Testes
        run: dotnet test --solution Vistoria.sln -c Release --no-build

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem `version`: lê o packageManager do package.json da raiz.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Contrato gerado igual ao commitado
        run: |
          pnpm gen:api
          if [ -n "$(git status --porcelain -- apps/web/src/shared/api/generated)" ]; then
            git status --short -- apps/web/src/shared/api/generated
            git diff -- apps/web/src/shared/api/generated
            echo "::error file=apps/web/src/shared/api/generated::Código gerado desatualizado: rode pnpm gen:api e commite a saída."
            exit 1
          fi

      - name: Lint, typecheck e testes
        run: pnpm check

      - name: Static export
        run: pnpm --filter web build

      # Spike 4: depois da primeira visita, o shell abre em modo avião (Chrome do runner).
      - name: Shell offline
        run: pnpm spike:shell

  # Os roteiros dos spikes contra a API real: o que a outbox e o pull fazem juntos só aparece com o banco, a API e o
  # static export de verdade (#144). O PULL_CHAOS (o pull a cada 1,5 s) entra quando estiver estável (#145).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      - run: pnpm install --frozen-lockfile

      # Geradas aqui e mascaradas: nenhuma senha no workflow (ADR 0025).
      - name: Senha do banco e chave do JWT desta execução
        run: node scripts/db-init/ci-env.mjs

      # A senha vai por variável de ambiente (`-e NOME` sem valor), nunca em argumento.
      - name: SQL Server
        run: |
          docker run -d --name vistoria-db -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          timeout 180 bash -c 'until docker logs vistoria-db 2>&1 | grep -q "SQL Server is now ready for client connections"; do sleep 2; done'

      # Em Development, a API aplica as migrações ao subir.
      - name: API
        working-directory: apps/api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
        run: |
          dotnet build Vistoria.Api -c Release
          nohup dotnet run --project Vistoria.Api -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8080/api/v1/health > /dev/null; do sleep 2; done'

      - name: Static export
        run: pnpm --filter web build

      - name: Roteiro da outbox
        run: pnpm spike:outbox

      - name: Roteiro do conflito
        run: pnpm spike:conflict

      - name: Roteiro do aparelho
        run: pnpm spike:device

      - name: Log da API
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/api.log"

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem SARIF (advanced-security: false): o job não precisa de security-events: write.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          version: 1.30.1
          min-severity: medium
          advanced-security: false
