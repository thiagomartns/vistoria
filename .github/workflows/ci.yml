name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    # Os testes de integração baixam a imagem do SQL Server (Testcontainers usa o Docker do runner).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      - name: Build (regenera openapi.json)
        run: dotnet build Vistoria.sln -c Release

      - name: openapi.json igual ao commitado
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=apps/api/openapi.json::openapi.json desatualizado: rode o build da API e commite o arquivo."
            exit 1
          fi

      - name: Testes
        run: dotnet test --solution Vistoria.sln -c Release --no-build

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem `version`: lê o packageManager do package.json da raiz.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Contrato gerado igual ao commitado
        run: |
          pnpm gen:api
          if [ -n "$(git status --porcelain -- apps/web/src/shared/api/generated)" ]; then
            git status --short -- apps/web/src/shared/api/generated
            git diff -- apps/web/src/shared/api/generated
            echo "::error file=apps/web/src/shared/api/generated::Código gerado desatualizado: rode pnpm gen:api e commite a saída."
            exit 1
          fi

      - name: Lint, typecheck e testes
        run: pnpm check

      - name: Static export
        run: pnpm --filter web build

      # Spike 4: depois da primeira visita, o shell abre em modo avião (Chrome do runner).
      - name: Shell offline
        run: pnpm spike:shell

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem SARIF (advanced-security: false): o job não precisa de security-events: write.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: 1.30.1
          min-severity: medium
          advanced-security: false
