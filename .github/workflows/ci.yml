name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    # Os testes de integração baixam a imagem do SQL Server (Testcontainers usa o Docker do runner).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: apps/api/global.json

      - name: Build (regenera openapi.json)
        run: dotnet build Vistoria.sln -c Release

      - name: openapi.json igual ao commitado
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=apps/api/openapi.json::openapi.json desatualizado: rode o build da API e commite o arquivo."
            exit 1
          fi

      - name: Testes
        run: dotnet test --solution Vistoria.sln -c Release --no-build

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem `version`: lê o packageManager do package.json da raiz.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Contrato gerado igual ao commitado
        run: |
          pnpm gen:api
          if [ -n "$(git status --porcelain -- apps/web/src/shared/api/generated)" ]; then
            git status --short -- apps/web/src/shared/api/generated
            git diff -- apps/web/src/shared/api/generated
            echo "::error file=apps/web/src/shared/api/generated::Código gerado desatualizado: rode pnpm gen:api e commite a saída."
            exit 1
          fi

      - name: Lint, typecheck e testes
        run: pnpm check

      - name: Static export
        run: pnpm --filter web build

      # Spike 4: depois da primeira visita, o shell abre em modo avião (Chrome do runner).
      - name: Shell offline
        run: pnpm spike:shell

      # A URL e o print de cada página aberta na hora da falha, que o roteiro que falhou grava em .screens/falha/ (#218).
      # Só essa pasta sobe: nada de infra/.env*, e os roteiros não gravam storageState em disco.
      - name: Prints da falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falha-web
          path: .screens/falha/
          retention-days: 7
          if-no-files-found: ignore

  # Os roteiros dos spikes contra a API real: o que a outbox e o pull fazem juntos só aparece com o banco, a API e o
  # static export de verdade (#144). A outbox e o conflito rodam com PULL_CHAOS: o pull a cada 1,5 s em vez de 60 s, caindo
  # em qualquer ponto do roteiro (#145).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: apps/api/global.json

      - run: pnpm install --frozen-lockfile

      # Geradas aqui e mascaradas: nenhuma senha no workflow (ADR 0025).
      - name: Senha do banco e chave do JWT desta execução
        run: node scripts/db-init/ci-env.mjs

      # A senha vai por variável de ambiente (`-e NOME` sem valor), nunca em argumento. A imagem é a do compose de dev,
      # numa tag exata (#194): nenhum outro lugar a repete.
      - name: SQL Server
        run: |
          image=$(docker compose -f infra/docker-compose.dev.yml config --images)
          docker run -d --name vistoria-db -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            -p 1433:1433 "$image"
          timeout 180 bash -c 'until docker logs vistoria-db 2>&1 | grep -q "SQL Server is now ready for client connections"; do sleep 2; done'

      # Em Development, a API aplica as migrações ao subir. Só aqui o rate limit sobe: os roteiros entram mais de 5 vezes
      # por minuto, e cada 429 era uma espera de 60 s pelo Retry-After (#197). O limite padrão continua coberto pelo
      # RateLimitTests e pelo passo 6 do smoke:prod, no job prod, cujo compose não leva estas variáveis.
      - name: API
        working-directory: apps/api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:8080
          RateLimit__CredentialPermitLimit: "1000"
          RateLimit__RefreshPermitLimit: "1000"
        run: |
          dotnet build Vistoria.Api -c Release
          nohup dotnet run --project Vistoria.Api -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health/ready > /dev/null; do sleep 2; done'

      - name: Static export
        run: pnpm --filter web build

      - name: Roteiro da outbox
        env:
          PULL_CHAOS: "1"
        run: pnpm spike:outbox

      - name: Roteiro do conflito
        env:
          PULL_CHAOS: "1"
        run: pnpm spike:conflict

      - name: Roteiro do aparelho
        run: pnpm spike:device

      # Duas vezes, para provar que rodar de novo completa até N sem duplicar nada (o seed confere o total pelo delta e
      # falha se não bater).
      - name: Seed
        run: |
          pnpm seed --inspections 200
          pnpm seed --inspections 200

      # Com os dados do seed: as telas não quebram de 768 a 1440 px, nem as listas, a tela de campo e o editor de
      # roteiro nos layouts de cada largura (#208).
      - name: Roteiro das telas
        run: pnpm layout:screens

      # Com as 200 vistorias do seed: prova que o roteiro do spike 2 segue de pé. Os números de 10 mil ficam no frontend.md.
      - name: Roteiro do volume
        run: pnpm spike:volume --inspections 200

      # O build do PREVIOUS_REF do roteiro da migração, pelo sha: o roteiro só o constrói (git worktree, install e
      # next build) se não estiver em node_modules/.cache/migration-spike (#197).
      - name: Commit do build anterior
        id: previous-ref
        # Sem o sha, o grep falha e o passo quebra: a chave nunca sai vazia.
        run: |
          sha=$(grep -oP 'const PREVIOUS_REF = "\K[0-9a-f]{40}' scripts/volume-spike/migration-spike.mjs)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache do build anterior
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/migration-spike
          key: migration-spike-${{ steps.previous-ref.outputs.sha }}

      # O banco local da versão 6 (a main de antes da #172) para a 7, com as mesmas 200: o build antigo vem do cache
      # acima ou de um git worktree.
      - name: Roteiro da migração
        run: pnpm spike:migration

      - name: Log da API
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/api.log"

      # A URL e o print de cada página aberta na hora da falha, que o roteiro que falhou grava em .screens/falha/ (#218).
      # Só essa pasta sobe: nada de infra/.env*, e os roteiros não gravam storageState em disco.
      - name: Prints da falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falha-e2e
          path: .screens/falha/
          retention-days: 7
          if-no-files-found: ignore

  # O docker-compose de produção (#177): as duas imagens, a migração pelo efbundle e o Caddy servindo o front e a API na
  # mesma origem, com TLS. As imagens saem do buildx com a tag do commit e passam pelo Trivy, e o compose sobe por essa
  # tag sem compilar, como no servidor (#195). O roteiro curto entra, sincroniza, renova a sessão pelo cookie e confere o
  # IP do rate limit.
  prod:
    name: prod
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # O cache do pnpm ao lado do build das imagens (ADR 0069): a `main` só lê o cache que a própria `main` gravou, e o de
      # um PR fica no escopo dele. Envenenar o cache exige código já rodando na `main`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # As duas imagens pela tag do commit, no cache do Actions por imagem: o `publish` monta as mesmas camadas, sem
      # compilar de novo.
      - name: Imagem da API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ghcr.io/thiagomartns/vistoria-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/thiagomartns/vistoria
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagem do proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/proxy/Dockerfile
          tags: ghcr.io/thiagomartns/vistoria-proxy:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/thiagomartns/vistoria
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max

      # Quebra com vulnerabilidade HIGH ou CRITICAL que já tem correção (#194). A sem correção não quebra, porque não há
      # o que subir.
      - name: Scan da imagem da API
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/thiagomartns/vistoria-api:${{ github.sha }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan da imagem do proxy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/thiagomartns/vistoria-proxy:${{ github.sha }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # As exceções que não nos atingem, cada uma com o porquê e a data em que vence.
          trivyignores: infra/proxy/.trivyignore

      # Gerados no infra/.env.prod (0600) e mascarados: nenhum segredo no workflow (ADR 0025).
      - name: Segredos desta execução
        run: pnpm prod:init

      # Pelo IMAGE_TAG do job, com as imagens que acabaram de passar pelo scan: `--no-build` quebra se faltar uma.
      - name: Compose de produção
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --no-build --wait

      # A entrega do M5 (#178). Antes do smoke: o passo 6 dele esgota o limite do signin do IP, e o 7, o do refresh.
      - name: Roteiro da V1
        run: pnpm spike:v1

      - name: Roteiro de produção
        run: pnpm smoke:prod

      # O backup do compose (#196, ADR 0070): o full saiu sozinho ao subir, antes dos roteiros; o log de agora leva o que
      # eles gravaram. Restaura os dois num SQL Server limpo e quebra se as contagens não baterem.
      - name: Backup e restauração
        run: pnpm backup:check

      - name: Logs do compose
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod logs --tail 200

      # A URL e o print de cada página aberta na hora da falha, que o roteiro que falhou grava em .screens/falha/ (#218).
      # Só essa pasta sobe: nada de infra/.env*, e os roteiros não gravam storageState em disco.
      - name: Prints da falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falha-prod
          path: .screens/falha/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem SARIF (advanced-security: false): o job não precisa de security-events: write.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          version: 1.30.1
          min-severity: medium
          advanced-security: false

  # A cada push na `main`, depois de todos os jobs passarem, as imagens da API e do proxy vão para o GHCR com a tag do
  # commit e a `main` (#195, ADR 0069). O build sai do cache do `prod` deste commit, e o Trivy passa de novo na imagem
  # que vai subir. Só este job escreve em packages; o login vem depois do scan, logo antes do push.
  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, e2e, prod, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # o checkout
      packages: write # o push das imagens no GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # O mesmo build do `prod`, lido do cache que ele gravou: as camadas que passaram pelos roteiros, sem compilar de novo.
      # Este job só lê o cache.
      - name: Imagem da API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: |
            ghcr.io/thiagomartns/vistoria-api:${{ github.sha }}
            ghcr.io/thiagomartns/vistoria-api:main
          labels: |
            org.opencontainers.image.source=https://github.com/thiagomartns/vistoria
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=api

      - name: Imagem do proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/proxy/Dockerfile
          tags: |
            ghcr.io/thiagomartns/vistoria-proxy:${{ github.sha }}
            ghcr.io/thiagomartns/vistoria-proxy:main
          labels: |
            org.opencontainers.image.source=https://github.com/thiagomartns/vistoria
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=proxy

      # Quebra com vulnerabilidade HIGH ou CRITICAL que já tem correção (#194). A sem correção não quebra, porque não há
      # o que subir.
      - name: Scan da imagem da API
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/thiagomartns/vistoria-api:${{ github.sha }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan da imagem do proxy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/thiagomartns/vistoria-proxy:${{ github.sha }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # As exceções que não nos atingem, cada uma com o porquê e a data em que vence.
          trivyignores: infra/proxy/.trivyignore

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag do commit antes da `main`: um push que cai no meio nunca deixa a `main` apontando para o que não subiu.
      - name: Push para o GHCR
        run: |
          for image in vistoria-api vistoria-proxy; do
            docker push "ghcr.io/thiagomartns/$image:$GITHUB_SHA"
            docker push "ghcr.io/thiagomartns/$image:main"
          done
